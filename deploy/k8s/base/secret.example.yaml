# Example only: this file is NOT part of the kustomization. Create the real
# Secret from your secret manager (External Secrets, Sealed Secrets, SOPS ...).
#
#   kubectl create secret generic bdpay-cloud \
#     --from-literal=BDPAY_CLOUD_DATABASE_URL='postgresql+psycopg://bdpay:...@db:5432/bdpay_cloud' \
#     --from-literal=BDPAY_CLOUD_MASTER_KEYS="$(bdpay-cloud gen-key)" \
#     --from-literal=BDPAY_CLOUD_REDIS_URL='redis://redis:6379/0' \
#     --from-literal=BDPAY_CLOUD_SMTP_USERNAME=... --from-literal=BDPAY_CLOUD_SMTP_PASSWORD=... \
#     --from-literal=BDPAY_CLOUD_METRICS_TOKEN="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: bdpay-cloud
type: Opaque
stringData:
  BDPAY_CLOUD_DATABASE_URL: postgresql+psycopg://bdpay:CHANGE-ME@postgres:5432/bdpay_cloud
  BDPAY_CLOUD_MASTER_KEYS: "k1:CHANGE-ME-run-bdpay-cloud-gen-key"
  BDPAY_CLOUD_REDIS_URL: redis://redis:6379/0
  BDPAY_CLOUD_SMTP_USERNAME: ""
  BDPAY_CLOUD_SMTP_PASSWORD: ""
  BDPAY_CLOUD_METRICS_TOKEN: CHANGE-ME

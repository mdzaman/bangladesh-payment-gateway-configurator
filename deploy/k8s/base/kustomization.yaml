# kubectl apply -k deploy/k8s/overlays/<yours>
# The base needs a Secret named `bdpay-cloud` (see secret.example.yaml) and an image.
# No image is published for this project: build one from the Dockerfile, push it to
# your registry, and set its name and tag in your overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - api.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/name: bdpay-cloud
      app.kubernetes.io/part-of: bdpay-cloud
    includeSelectors: false
images:
  - name: bdpay-cloud
    newName: registry.example.com/bdpay-cloud
    newTag: "1.0.0"

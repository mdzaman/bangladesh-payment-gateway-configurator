apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bdpay-cloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 512k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    # /metrics is for the cluster's scraper, not the internet.
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics { return 404; }
spec:
  ingressClassName: nginx
  tls:
    - hosts: [pay.example.com]
      secretName: bdpay-cloud-tls
  rules:
    - host: pay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bdpay-cloud-api
                port: { name: http }
